<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #EDEAE2;
            --bg-elevated: #F7F5F0;
            --ink: #1E211C;
            --ink-soft: #5B5F57;
            --ink-faint: #8B8F84;
            --border: #DAD5C9;
            --border-strong: #C6C0B2;
            --accent: #355E4C;
            --accent-ink: #F4F1E9;
            --overdue: #A6432E;
            --overdue-soft: #F1DED8;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-ring: 0 0 0 2px var(--accent);
            color-scheme: light;
        }

        * , *::before, *::after { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; height: 100%; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 36px 32px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 500;
            margin: 0 0 4px;
            text-align: center;
        }

        .subtext {
            color: var(--ink-soft);
            font-size: 13.5px;
            text-align: center;
            margin: 0 0 24px;
        }

        .error_message {
            color: var(--overdue);
            background: var(--overdue-soft);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 13.5px;
            font-weight: 600;
            margin: 0 0 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .field label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink-soft);
        }

        input[type="text"],
        input[type="password"] {
            font-family: inherit;
            font-size: 14px;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            width: 100%;
        }

        input:focus-visible {
            outline: none;
            box-shadow: var(--shadow-ring);
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-ink);
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            padding: 11px 16px;
            margin-top: 6px;
            cursor: pointer;
        }

        .btn-primary:hover { filter: brightness(1.06); }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14181A;
                --bg-elevated: #1B211D;
                --ink: #E9E6DC;
                --ink-soft: #9CA39A;
                --ink-faint: #6B7168;
                --border: #2A312C;
                --border-strong: #394038;
                --accent: #7FC2A4;
                --accent-ink: #12201A;
                --overdue: #E08469;
                --overdue-soft: #35241F;
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #14181A;
            --bg-elevated: #1B211D;
            --ink: #E9E6DC;
            --ink-soft: #9CA39A;
            --ink-faint: #6B7168;
            --border: #2A312C;
            --border-strong: #394038;
            --accent: #7FC2A4;
            --accent-ink: #12201A;
            --overdue: #E08469;
            --overdue-soft: #35241F;
            color-scheme: dark;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Welcome back</h1>
        <p class="subtext">You need to login to access the app</p>

        {% if messages %}
            {% for msg in messages %}
                <p class="{% if msg.tags == 'error' %}error_message{% endif %}">{{ msg }}</p>
            {% endfor %}
        {% endif %}

        <form action="{% url 'main:login_page' %}" method="POST">
            {% csrf_token %}
            <div class="field">
                <label for="username">Foydalanuvchi nomingiz</label>
                <input type="text" id="username" name="username" placeholder="Foydalanuvchi nomingiz" required>
            </div>
            <div class="field">
                <label for="password">Parolingiz</label>
                <input type="password" id="password" name="password" placeholder="Parolingiz" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
    </div>
</body>
</html>
